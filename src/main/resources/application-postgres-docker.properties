# ===================================================================
# PROFIL: postgres-docker (Container PostgreSQL din Docker Compose)
# ===================================================================

# Conexiune Docker PostgreSQL (Host Port 5433 -> Container Port 5432)
spring.datasource.url=jdbc:postgresql://localhost:5433/supplychain_db
spring.datasource.username=${DOCKER_POSTGRES_USER:supplychain}
spring.datasource.password=${DOCKER_POSTGRES_PASSWORD:supplychain_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations (enterprise database change management)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
