# ===================================================================
# PROFIL: postgres-docker (Container PostgreSQL din Docker Compose)
# ===================================================================

# Conexiune Docker PostgreSQL (Host Port 5433 -> Container Port 5432)
spring.datasource.url=jdbc:postgresql://localhost:5433/supplychain_db
spring.datasource.username=${DOCKER_POSTGRES_USER:supplychain}
spring.datasource.password=${DOCKER_POSTGRES_PASSWORD:supplychain_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations (enterprise database change management)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# RabbitMQ AMQP Listeners & Outbox (active in production / docker)
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_AUTO_STARTUP:true}
supplychain.rabbitmq.enabled=${RABBITMQ_ENABLED:true}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=5
spring.rabbitmq.requested-heartbeat=60
spring.rabbitmq.cache.channel.size=25

# Production Zero-Trust Hardening
security.mock-headers.enabled=false
security.allow-anonymous-fallback=false
security.seed-default-users=false

# Stripe Production Gateway Mode
stripe.simulation-mode=false
