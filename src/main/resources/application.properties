# Spring Application Configuration
spring.application.name=supplychain-p2p
server.port=8080

# Logging
logging.level.ro.uaic.feaa.sdbis.supplychain=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG

# Database Configuration (H2 in PostgreSQL compatibility mode for local dev & testing)
spring.datasource.url=jdbc:h2:mem:supplychaindb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Content Negotiation
spring.mvc.contentnegotiation.favor-parameter=true
spring.mvc.contentnegotiation.parameter-name=format

# Jackson
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# Stripe Configuration (ADR-010)
stripe.apiKey=${STRIPE_API_KEY:mock_sandbox_key_12345}
stripe.webhookSecret=${STRIPE_WEBHOOK_SECRET:mock_sandbox_secret_12345}
stripe.currency=eur
stripe.simulation-mode=${STRIPE_SIMULATION_MODE:true}

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# SpringDoc OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# RabbitMQ Configuration (ADR-004)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.auto-startup=false
supplychain.rabbitmq.enabled=${RABBITMQ_ENABLED:false}
supplychain.outbox.dispatcher.enabled=${OUTBOX_DISPATCHER_ENABLED:false}

# JWT Signing Key (RFC 7519 HMAC-SHA256, minimum 256 bits)
jwt.secret=${JWT_SECRET:supplychain-secure-256-bit-hex-or-base64-random-token-secret-production-quality-2026}

# DevSecOps RBAC Security Configuration (Zero-Trust Hardened)
security.mock-headers.enabled=${SECURITY_MOCK_HEADERS_ENABLED:false}
security.allow-anonymous-fallback=${SECURITY_ALLOW_ANONYMOUS_FALLBACK:false}
security.seed-default-users=${SECURITY_SEED_DEFAULT_USERS:false}
