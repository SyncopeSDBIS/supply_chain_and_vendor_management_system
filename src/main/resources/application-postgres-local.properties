# ===================================================================
# PROFIL: postgres-local (PostgreSQL 17 instalat nativ pe Windows)
# ===================================================================

# Conexiune PostgreSQL Local (Port 5432)
spring.datasource.url=jdbc:postgresql://localhost:5432/supplychain_db
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations (executa automat V1, V2, V3, V4 din db/migration)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
